<!-- templates/fragments/layout.html -->
<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="layout(title, content)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:replace="${title}">Xarxallibres</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/xarxallibres.css}" />
  </head>
  <body class="xarxa-body">
    <!-- Cabecera con logos y título -->
    <div class="container-fluid h-custom">
      <div class="row d-flex justify-content-center h-100">
        <div style="text-align: left" class="col-md-8 col-lg-6 col-xl-2">
          <img
            id="logo_IES"
            th:src="@{/img/Logo_IES.png}"
            src="/img/Logo_IES.png"
            class="img-fluid"
            alt="Logo_IES"
          />
        </div>
        <div class="col-md-8 col-lg-6 col-xl-8">
          <div class="jumbotron">
            <p><i class="bi bi-book-half"></i> Xarxallibres</p>
          </div>
        </div>
        <div style="text-align: right" class="col-md-8 col-lg-6 col-xl-2">
          <img
            id="logo_GVA"
            th:src="@{/img/gva.png}"
            src="/img/gva.png"
            class="img-fluid"
            alt="Logo_GVA"
          />
        </div>
      </div>
    </div>

    <!-- Menú de navegación con navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark xarxa-navbar sticky-top">
      <div class="container-fluid px-3">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
          <i class="bi bi-book-half"></i> Xarxallibres
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Mostrar menú"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/alumnos}">
                <i class="bi bi-mortarboard"></i> Alumnos
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/cursos}">
                <i class="bi bi-people"></i> Cursos
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/libros}">
                <i class="bi bi-journals"></i> Libros
              </a>
            </li>
          </ul>
          <span class="xarxa-avatar" title="Usuario">
            <i class="bi bi-person-fill"></i>
          </span>
        </div>
      </div>
    </nav>

    <!-- Contenido dinámico -->
    <main class="container-fluid px-4 py-4">
      <th:block th:replace="${content}" />
    </main>

    <!-- Pie de página   -->
    <footer class="xarxa-footer text-center py-3">
      <p class="mb-0">📚 Xarxallibres — IES Doctor Balmis</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/paginacion.js"></script>
  </body>
</html>
